<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Token je v adrese. Bez tohohle by odešel v hlavičce Referer na každou
     cizí doménu, na kterou by stránka sáhla (třeba na překladač). -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Anwesenheit · Docházka — SubBau</title>
<style>
  :root{
    --tmava:#211D1A; --zlata:#E8A13A; --seda:#9a9082; --seda2:#6b6157;
    --ram:#e0d9cf; --pozadi:#f7f4ef; --zelena:#3f7d54;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--pozadi);color:var(--tmava);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       font-size:15px;line-height:1.5}
  .obal{max-width:1000px;margin:0 auto;padding:18px 14px 60px}
  header{background:var(--tmava);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px}
  header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px}
  header .pod{color:var(--zlata);font-size:13px;font-weight:700;margin-top:3px}
  header .obdobi{color:#cfc7bd;font-size:13px;margin-top:8px}
  /* Lidi je potřeba od sebe jasně odlišit — jinak se v dlouhém seznamu ztratí,
     komu který den patří. Proto silnější rám, víc místa a barevný pruh vlevo. */
  .clovek{background:#fff;border:1px solid var(--ram);border-left:5px solid var(--tmava);
          border-radius:14px;margin-bottom:26px;overflow:hidden;
          box-shadow:0 2px 10px rgba(33,29,26,.07)}
  .hlava{display:flex;align-items:flex-start;gap:12px;
         padding:14px 16px;background:#fbf9f6;border-bottom:2px solid var(--ram)}
  .cislo{flex:none;width:26px;height:26px;border-radius:7px;background:var(--tmava);color:var(--zlata);
         font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  /* Hodiny vpravo v rohu, ať se dají porovnat po sloupci. */
  .soucet-rok{margin-left:auto;text-align:right;flex:none;
              font-size:19px;font-weight:800;color:var(--zelena);white-space:nowrap}
  .soucet-rok small{display:block;font-size:10px;color:var(--seda);font-weight:600}
  .pozn-obal{padding:10px 16px 0}
  /* Ukončená spolupráce. Když je zaškrtnutá, karta člověka zešedne a nahoře
     je to napsané — ať se to na vytištěném výkazu nedá přehlédnout. */
  /* Dovolená a nemoc v hlavičce karty — ať odběratel hned vidí, kdo nepřijde. */
  .absence{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .absence span{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;
    border-radius:6px;white-space:nowrap}
  .abs-dov{background:#e4eefb;color:#1f4f8f}
  .abs-nem{background:#fbe6e2;color:#9c3b22}
  /* Zvýraznění poznámky. Barvy jsou pevně dané, odběratel si vybírá z nich. */
  .pozn-nastroje{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;
    font-size:11.5px;color:var(--seda)}
  .pozn-nastroje button{font-family:inherit;font-size:11.5px;padding:3px 9px;border-radius:6px;
    border:1.5px solid var(--ram);background:#fff;cursor:pointer;color:var(--tmava)}
  .pozn-nastroje button.on{border-color:var(--tmava);background:var(--tmava);color:#fff}
  /* Tučné se ve Wordu i Excelu v němčině značí velkým F (Fett) — stejně jako
     u nás B. Tlačítko je proto čtvercové s jediným písmenem, jak to lidi znají. */
  .pozn-nastroje button.tucne{width:26px;height:26px;padding:0;font-size:14px;
    font-weight:900;font-family:Georgia,'Times New Roman',serif;line-height:1}
  .pozn-barvy{display:flex;gap:4px}
  .pozn-barvy button{width:20px;height:20px;padding:0;border-radius:50%;border:2px solid transparent}
  .pozn-barvy button.on{border-color:var(--tmava)}
  @media print{.pozn-nastroje{display:none}}
  /* Ukončená spolupráce je v hlavičce u jména, ne dole u poznámky. */
  .konec-obal{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    margin-top:7px;font-size:12px;color:var(--seda)}
  .konec-obal input[type=checkbox]{width:16px;height:16px;cursor:pointer;flex:none}
  .konec-obal input[type=date]{font-family:inherit;font-size:12.5px;padding:4px 7px;
    border:1.5px solid var(--ram);border-radius:7px;color:var(--tmava)}
  .konec-obal label{display:flex;align-items:center;gap:7px;cursor:pointer}
  .clovek.skoncil{opacity:.72;border-left-color:var(--seda)}
  .konec-stitek{display:inline-block;background:#f3e2e0;color:#9c3b22;font-weight:800;
    font-size:11px;padding:2px 8px;border-radius:6px;margin-left:8px;white-space:nowrap}
  @media print{
    .konec-obal input,.konec-obal label{display:none}
    .clovek.skoncil{opacity:1}
  }
  .znamka-popis{align-self:center;font-size:11.5px;color:var(--seda);margin-right:4px}
  .znamka-popis div{font-size:10.5px}
  .znamka-x{width:auto!important;padding:0 9px!important;font-weight:600!important}
  .jmeno{font-size:16px;font-weight:800}
  .tab{width:100%;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;
     color:var(--seda);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--ram);
     white-space:nowrap}
  th small{display:block;font-size:9px;text-transform:none;letter-spacing:0;
           color:var(--ram);font-weight:600}
  td{padding:10px;border-bottom:1px solid #f1ece4;vertical-align:top}
  tr:last-child td{border-bottom:none}
  .cas{font-variant-numeric:tabular-nums;white-space:nowrap}
  .bezi{color:#b8860b;font-weight:800}
  .radek-bezi{background:#fffaf0}
  .probiha{color:#b8860b;font-weight:700;font-size:13px}
  /* Poměr 3:4 jako průkazová fotka — na obličej je lepší než kolečko. */
  .foto{width:78px;height:104px;border-radius:8px;object-fit:cover;background:var(--pozadi);
        border:2px solid var(--ram);flex:none;cursor:pointer;display:block}
  .foto-prazdna{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--seda)}
  .foto-x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;padding:0;border-radius:50%;
          border:1.5px solid #fff;background:var(--tmava);color:#fff;font-size:11px;line-height:1;
          cursor:pointer;font-family:inherit}
  @media print{.foto-x{display:none}}
  .znamka{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
  .znamka button{width:30px;height:30px;padding:0;border-radius:8px;border:1.5px solid var(--ram);
                 background:#fff;color:var(--seda2);font-weight:800;font-size:13px;cursor:pointer}
  .znamka button.on{background:var(--tmava);color:#fff;border-color:var(--tmava)}
  .znamka button.mimo{opacity:.45}
  textarea.pozn{width:100%;margin-top:7px;padding:8px 10px;border:1.5px solid var(--ram);
                border-radius:9px;font-family:inherit;font-size:13.5px;resize:vertical;
                box-sizing:border-box;background:#fff;color:var(--tmava)}
  @media print{.znamka,textarea.pozn{display:none}}
  .penize{font-size:12.5px;color:var(--seda2);margin-top:3px;line-height:1.5}
  .penize b{color:var(--tmava);font-variant-numeric:tabular-nums}
  .souhrn{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--seda2);
          margin-top:6px;padding-top:6px;border-top:1px dashed var(--ram)}
  .souhrn b{color:var(--tmava);font-variant-numeric:tabular-nums}
  select{font-family:inherit;font-size:14px;font-weight:700;padding:9px 12px;
         border-radius:10px;border:1.5px solid var(--ram);background:#fff;color:var(--tmava)}
  .hod{font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .drobne{font-size:11.5px;color:var(--seda2)}
  .de{color:var(--seda);font-size:11.5px;font-style:italic}
  .celkem{background:var(--tmava);color:#fff;border-radius:14px;padding:16px 20px;
          display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .celkem .c{font-size:24px;font-weight:800;color:var(--zlata)}
  .tlacitka{display:flex;gap:9px;margin:16px 0;flex-wrap:wrap}
  button{font-family:inherit;font-size:14px;font-weight:700;padding:11px 18px;
         border-radius:11px;border:1.5px solid var(--tmava);background:#fff;
         color:var(--tmava);cursor:pointer}
  button.hlavni{background:var(--tmava);color:var(--zlata);border-color:var(--tmava)}
  .zprava{background:#fff;border:1px solid var(--ram);border-radius:14px;
          padding:34px 22px;text-align:center;color:var(--seda2)}
  .zprava h2{margin:0 0 8px;font-size:17px;color:var(--tmava)}
  .pata{margin-top:22px;font-size:11.5px;color:var(--seda);text-align:center;line-height:1.7}
  @media print{
    body{background:#fff}
    .tlacitka,.pata{display:none}
    .obal{max-width:none;padding:0}
    header{background:#fff;color:#000;border:1px solid #000;border-radius:0}
    header .pod{color:#000}header .obdobi{color:#333}
    .clovek{break-inside:avoid;page-break-inside:avoid;border:1px solid #999;border-radius:0}
    .celkem{background:#fff;color:#000;border:2px solid #000;border-radius:0}
    .celkem .c{color:#000}
  }
</style>
</head>
<body>
<div class="obal" id="obal">
  <div class="zprava"><h2>Wird geladen…</h2><div class="de">Načítám…</div></div>
</div>

<script>
// Token z adresy. Do stránky se nikde nevypisuje.
var TOKEN = new URLSearchParams(location.search).get('t') || '';
var TYDEN = null;   // {kw, rok} — když je prázdné, server dá probíhající týden
var obal = document.getElementById('obal');

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function chyba(nadpis, de, cs){
  obal.innerHTML = '<div class="zprava"><h2>' + esc(nadpis) + '</h2>'
    + '<div>' + esc(de) + '</div><div class="de">' + esc(cs) + '</div></div>';
}
var DNY_DE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var DNY_CS = ['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];
function datumDe(iso){
  var d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return DNY_DE[d.getDay()].slice(0,2) + ' ' +
    String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.';
}
function datumCs(iso){
  var d = new Date(iso + 'T00:00:00');
  return isNaN(d) ? iso : DNY_CS[d.getDay()];
}
// Povolené barvy poznámky. Musí sedět se seznamem na serveru i v migraci —
// odběratel si vybírá z nich, nic jiného se neuloží.
var BARVY_POZNAMKY = [
  { kod:'cervena',  hex:'#c0281c', popis:'Rot · červená' },
  { kod:'oranzova', hex:'#c97a12', popis:'Orange · oranžová' },
  { kod:'zelena',   hex:'#1d7a52', popis:'Grün · zelená' },
  { kod:'modra',    hex:'#1f4f8f', popis:'Blau · modrá' },
  { kod:'cerna',    hex:'#211d1a', popis:'Schwarz · černá' }
];

// Styl poznámky podle zvolených voleb. Skládá se tu, ne v datech — z databáze
// chodí jen „tučně ano/ne" a název barvy, nikdy hotový kus stylu.
function stylPoznamky(pz){
  var kusy = [];
  if (pz && pz.pozn_tucne) kusy.push('font-weight:800');
  var b = null;
  for (var i = 0; i < BARVY_POZNAMKY.length; i++) {
    if (pz && BARVY_POZNAMKY[i].kod === pz.pozn_barva) b = BARVY_POZNAMKY[i];
  }
  if (b) kusy.push('color:' + b.hex);
  return kusy.join(';');
}

// Dovolená a nemoc v hlavičce karty. Odběratel musí vidět, kdo mu nepřijde
// a dokdy — do teď se to dozvěděl, až ten člověk nedorazil.
function absenceHtml(wid){
  var sez = (DATA && DATA.dovolene && DATA.dovolene[wid]) || [];
  if (!sez.length) return '';
  return '<div class="absence">' + sez.slice(0, 4).map(function(a){
    var kdy = datumPlne(a.od) + (a.do && a.do !== a.od ? ' – ' + datumPlne(a.do) : '');
    return '<span class="' + (a.nemoc ? 'abs-nem' : 'abs-dov') + '">'
         + (a.nemoc ? 'Krankheit · nemoc ' : 'Urlaub · dovolená ') + kdy + '</span>';
  }).join('') + '</div>';
}

// Celé datum i s rokem — u ukončené spolupráce musí být jasné, kterého roku.
// Tvar 15.09.2026 čtou Němci i Češi stejně.
function datumPlne(iso){
  var d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return String(d.getDate()).padStart(2,'0') + '.' +
         String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}
function hod(n){ return (Number(n)||0).toFixed(2).replace('.', ','); }

// Překlad popisu práce do němčiny. Je to ozdoba — když překladač neodpoví,
// zůstane český text a stránka se kvůli tomu nezdrží.
var mezipamet = {};
function prelozit(text){
  var t = (text||'').trim();
  if (!t) return Promise.resolve(null);
  if (mezipamet[t] !== undefined) return Promise.resolve(mezipamet[t]);
  var ac = new AbortController();
  var casovac = setTimeout(function(){ try{ac.abort()}catch(e){} }, 3500);
  return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=cs&tl=de&dt=t&q='
      + encodeURIComponent(t), { signal: ac.signal, referrerPolicy: 'no-referrer' })
    .then(function(r){ return r.ok ? r.json() : null })
    .then(function(d){
      var v = d && d[0] ? d[0].map(function(s){ return s[0] }).join('') : null;
      mezipamet[t] = v || null;
      return mezipamet[t];
    })
    .catch(function(){ mezipamet[t] = null; return null })
    .finally(function(){ clearTimeout(casovac) });
}

var DATA = null;
var prekladyCache = {};

function vykreslit(d, preklady){
  preklady = preklady || {};
  var podle = {};
  d.radky.forEach(function(r){ (podle[r.jmeno] = podle[r.jmeno] || []).push(r) });
  var jmena = Object.keys(podle).sort(function(a,b){ return a.localeCompare(b,'cs') });

  var celkem = 0, poradi = 0;
  var html = '<header>'
    + '<h1>' + esc(d.nazev) + '</h1>'
    + '<div class="pod">Anwesenheitsübersicht · Přehled docházky</div>'
    + '<div class="obdobi">KW ' + d.kw + ' / ' + d.rok + ' &nbsp;·&nbsp; '
    + esc(d.od.split('-').reverse().join('.')) + ' – ' + esc(d.do.split('-').reverse().join('.'))
    + '</div></header>';

  // Přepínač týdnů — odběratel si smí prolistovat i starší.
  if (d.tydny && d.tydny.length){
    html += '<div class="tlacitka" style="margin-bottom:6px">'
      + '<label style="align-self:center;font-size:13px;color:var(--seda2);font-weight:700">'
      + 'Woche · Týden</label>'
      + '<select id="vyber-tydne" onchange="zmenTyden(this.value)">'
      + d.tydny.map(function(t){
          var v = t.kw + '/' + t.rok
          return '<option value="' + v + '"' + (t.kw === d.kw && t.rok === d.rok ? ' selected' : '')
               + '>KW ' + t.kw + ' / ' + t.rok + '</option>'
        }).join('')
      + '</select>'
      + '<label style="display:flex;align-items:center;gap:8px;align-self:center;'
      + 'font-size:13.5px;font-weight:700;color:' + (d.uhrazeno ? 'var(--zelena)' : 'var(--seda2)') + ';cursor:pointer">'
      + '<input type="checkbox" id="uhrazeno" onchange="oznacUhrazeno(this.checked)"'
      + (d.uhrazeno ? ' checked' : '') + ' style="width:19px;height:19px">'
      + '<span>Rechnungen dieser Woche bezahlt'
      + '<div style="font-size:11.5px;font-weight:500;color:var(--seda)">tento týden uhrazené faktury</div>'
      + '</span></label>'
      + '</div>';
  }

  html += '<div class="tlacitka">'
    + '<button class="hlavni" onclick="window.print()">📄 Als PDF speichern · Uložit do PDF</button>'
    + '<button onclick="stahnoutCsv()">📊 Excel (CSV)</button>'
    + '<button onclick="nacti(true)">🔄 Aktualisieren · Obnovit</button>'
    + '<span id="stav-obnovy" class="de" style="align-self:center"></span>'
    + '</div>';

  if (!jmena.length){
    html += '<div class="zprava"><h2>Keine Einträge für diese Woche</h2>'
      + '<div class="de">Za tento týden zatím není zapsaná žádná docházka.</div></div>';
    obal.innerHTML = html;
    return;
  }

  jmena.forEach(function(jm){
    var dny = podle[jm].slice().sort(function(a,b){ return a.datum.localeCompare(b.datum) });
    var suma = dny.reduce(function(s,r){ return s + (Number(r.hodiny)||0) }, 0);
    celkem += suma;
    // Peníze: sazba pracovníka a provize SubBau. Sčítá se den po dni, protože
    // se sazba mohla během období změnit — jinak by to nesedělo s fakturou.
    //
    // Když se sazba měnila, NEUKAZUJEME průměr. Průměrné číslo (22,80) neodpovídá
    // žádné skutečné sazbě a odběratele jen mate. Místo toho se vypíše rozpis:
    // kolik hodin za kolik. Stejně to má i faktura, když sazba skočí uprostřed týdne.
    var fakturovano = 0, provizeCelkem = 0
    var podleSazby = {}, podleProvize = {}
    dny.forEach(function(r){
      if (r.probiha) return
      var h = Number(r.hodiny) || 0
      var sz = Number(r.sazba) || 0
      var pr = Number(r.provize) || 0
      fakturovano += h * sz
      provizeCelkem += h * pr
      podleSazby[sz.toFixed(2)] = (podleSazby[sz.toFixed(2)] || 0) + h
      podleProvize[pr.toFixed(2)] = (podleProvize[pr.toFixed(2)] || 0) + h
    })
    // „20,00 Std. × 22,00 €" pro každou sazbu, od nejnižší
    function rozpis(mapa, jednotka){
      var klice = Object.keys(mapa).sort(function(a,b){ return Number(a) - Number(b) })
      if (!klice.length) return '—'
      // Nulová sazba = den, který se nefakturuje. Bez popisku by to vypadalo
      // jako chyba; „nicht berechnet" to vysvětlí.
      if (klice.length === 1) return Number(klice[0]) === 0
        ? '<b>nicht berechnet</b>'
        : '<b>' + hod(klice[0]) + ' €</b>/' + jednotka
      return klice.map(function(k){
        return Number(k) === 0
          ? '<b>' + hod(mapa[k]) + ' Std.</b> · <b>nicht berechnet</b>'
          : '<b>' + hod(mapa[k]) + ' Std.</b> × <b>' + hod(k) + ' €</b>'
      }).join(' &nbsp;·&nbsp; ')
    }

    var wid = (dny[0] && dny[0].worker) || ''
    var pz = (DATA.poznamky && DATA.poznamky[wid]) || { foto:null, poznamka:'', hodnoceni:null }
    poradi++

    var skoncil = !!pz.spoluprace_ukoncena
    var datumKonce = pz.spoluprace_do || ''
    html += '<div class="clovek' + (skoncil ? ' skoncil' : '') + '">'
      // ---- hlavička: číslo, fotka, jméno a peníze vlevo, hodiny vpravo v rohu
      + '<div class="hlava">'
      + '<div class="cislo">' + poradi + '</div>'
      + (pz.foto
          ? '<div style="position:relative;flex:none">'
            + '<img class="foto" src="' + esc(pz.foto) + '" alt="" onclick="vyberFoto(\'' + esc(wid) + '\')" title="Foto ändern · změnit fotku">'
            + '<button class="foto-x" onclick="smazFoto(\'' + esc(wid) + '\')" title="Foto entfernen · odebrat fotku">✕</button>'
            + '</div>'
          : '<div class="foto foto-prazdna" onclick="vyberFoto(\'' + esc(wid) + '\')" title="Foto hinzufügen · přidat fotku">＋</div>')
      + '<div style="min-width:0;flex:1">'
      +   '<div class="jmeno">' + esc(jm)
      +     (skoncil
            ? '<span class="konec-stitek">Zusammenarbeit beendet · spolupráce ukončena'
              + (datumKonce ? ' ' + datumPlne(datumKonce) : '') + '</span>'
            : '')
      +   '</div>'
      +   absenceHtml(wid)

    dny.forEach(function(r){

  var fakturovanoVse = 0, provizeVse = 0;
  d.radky.forEach(function(r){
    if (r.probiha) return;

  html += '<div class="celkem"><div>Gesamt · Celkem<div style="font-size:12px;color:#cfc7bd">'

    + '<div style="text-align:right"><div class="c">' + hod(fakturovanoVse + provizeVse) + ' €</div>'
    + '<div style="font-size:13px;color:#cfc7bd">' + hod(celkem) + ' Std.</div></div></div>';

  html += '<div class="pata">'
    + '<b>Nach Arbeitsende wird die vollständige Arbeitszeit angezeigt.</b><br>'

    + 'Tätigkeitsbeschreibungen sind maschinell übersetzt.<br>'
    + 'Popisy práce jsou přeložené strojově.<br><br>'
    + 'Bitte diesen Link nicht weitergeben · Odkaz prosím nikomu nepřeposílejte.</div>';

  obal.innerHTML = html;
}

// ===== CO SI ODBĚRATEL POZNAMENÁ =====
// Fotka, poznámka a známka. Ukládá se to k odkazu, ne k pracovníkovi —
// jiný odběratel to nevidí a v appce SubBau se to nikde neobjeví.

// `selhalo` se zavolá, když server zápis nevzal. Bez toho zůstalo zaškrtnuté
// políčko vizuálně zaškrtnuté, ačkoli se nic neuložilo — a odběratel to zjistil
// až po obnovení stránky, kdy mu volba zmizela.
function ulozPoznamkuNaServer(data, hotovo, selhalo){
  fetch('/api/klient-dochazka?t=' + encodeURIComponent(TOKEN), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
    cache: 'no-store',
  })
    .then(function(r){ return r.json().catch(function(){ return {} }) })
    .then(function(j){
      if (j && j.ok) { stav('Gespeichert · uloženo'); hotovo && hotovo() }
      else {
        var duvod = (j && j.chyba === 'fotka_prilis_velka')
          ? 'Foto zu groß · fotka je moc velká'
          : (j && j.chyba === 'spatne_datum')
            ? 'Ungültiges Datum · neplatné datum'
            : 'Nicht gespeichert · neuloženo';
        stav(duvod);
        selhalo && selhalo(duvod);
      }
    })
    .catch(function(){ stav('Keine Verbindung · bez připojení'); selhalo && selhalo('offline') });
}

// Fotku zmenšíme rovnou v prohlížeči. Z mobilu chodí snímky přes 3 MB a ty
// by server odmítl — po zmenšení na 256 px má pár desítek kilobajtů.
function vyberFoto(workerId){
  if (!workerId) return;
  var vstup = document.createElement('input');
  vstup.type = 'file';
  vstup.accept = 'image/*';
  vstup.onchange = function(){
    var soubor = vstup.files && vstup.files[0];
    if (!soubor) return;
    stav('Wird verkleinert…');
    var cteni = new FileReader();
    cteni.onload = function(){
      var obr = new Image();
      obr.onload = function(){
        // Průkazová fotka na výšku, poměr 3:4. Ořízne se ze STŘEDU a mírně
        // nad ním — obličej bývá v horní části snímku, ne přesně uprostřed.
        var SIR = 300, VYS = 400, POMER = SIR / VYS;
        var pl = document.createElement('canvas');
        pl.width = SIR; pl.height = VYS;
        var ctx = pl.getContext('2d');
        var sirOrez = obr.width, vysOrez = obr.height;
        if (obr.width / obr.height > POMER) sirOrez = obr.height * POMER;   // moc široká
        else vysOrez = obr.width / POMER;                                    // moc vysoká
        var x = (obr.width - sirOrez) / 2;
        var y = Math.max(0, (obr.height - vysOrez) / 2 - vysOrez * 0.08);
        ctx.drawImage(obr, x, y, sirOrez, vysOrez, 0, 0, SIR, VYS);
        var maly = pl.toDataURL('image/jpeg', 0.72);
        ulozPoznamkuNaServer({ worker_id: workerId, foto: maly }, function(){
          if (!DATA.poznamky) DATA.poznamky = {};
          DATA.poznamky[workerId] = DATA.poznamky[workerId] || {};
          DATA.poznamky[workerId].foto = maly;
          vykreslit(DATA, prekladyCache);
        });
      };
      obr.onerror = function(){ stav('Bild konnte nicht gelesen werden · obrázek nejde načíst') };
      obr.src = cteni.result;
    };
    cteni.readAsDataURL(soubor);
  };
  vstup.click();
}

function smazFoto(workerId){
  if (!workerId) return;
  if (!confirm('Foto entfernen?\nOdebrat fotku?')) return;
  ulozPoznamkuNaServer({ worker_id: workerId, foto: null }, function(){
    if (DATA.poznamky && DATA.poznamky[workerId]) DATA.poznamky[workerId].foto = null;
    vykreslit(DATA, prekladyCache);
  });
}

function ulozPoznamku(pole){
  var wid = pole.getAttribute('data-w');
  if (!wid) return;
  var text = String(pole.value || '').slice(0, 1000);
  ulozPoznamkuNaServer({ worker_id: wid, poznamka: text }, function(){
    if (!DATA.poznamky) DATA.poznamky = {};
    DATA.poznamky[wid] = DATA.poznamky[wid] || {};
    DATA.poznamky[wid].poznamka = text;   // ať se po obnovení nevrátí staré
  });
}

function oznacKartu(wid){
  var pole = document.querySelector('input[type=checkbox][data-w="' + wid + '"]');
  var karta = pole && pole.closest ? pole.closest('.clovek') : null;
  if (!karta) return;
  var pz = (DATA.poznamky && DATA.poznamky[wid]) || {};
  var skoncil = !!pz.spoluprace_ukoncena;
  if (skoncil) karta.className = karta.className.indexOf('skoncil') < 0 ? karta.className + ' skoncil' : karta.className;
  else karta.className = karta.className.replace(/\s*skoncil/g, '');
  var jmeno = karta.querySelector('.jmeno');
  if (!jmeno) return;
  var stitek = jmeno.querySelector('.konec-stitek');
  if (!skoncil) { if (stitek) stitek.remove(); return; }
  if (!stitek) {
    stitek = document.createElement('span');
    stitek.className = 'konec-stitek';
    jmeno.appendChild(stitek);
  }
  stitek.textContent = 'Zusammenarbeit beendet · spolupráce ukončena'
    + (pz.spoluprace_do ? ' ' + datumPlne(pz.spoluprace_do) : '');
}

// Nástroje poznámky se ukážou, teprve když odběratel do poznámky klikne,
// a zase zmizí, když z ní odejde. Schovávání je odložené: kliknutí na
// tlačítko nejdřív vyhodí zaostření z textarey, a kdybychom je schovali
// hned, kliknutí by dopadlo do prázdna.
function nastrojeU(pole){
  return pole && pole.parentElement ? pole.parentElement.querySelector('.pozn-nastroje') : null;
}
function ukazNastroje(pole){
  var n = nastrojeU(pole);
  if (n) { n.style.display = 'flex'; n.dataset.drzet = '1'; }
}
function schovejNastroje(pole){
  var n = nastrojeU(pole);
  if (!n) return;
  n.dataset.drzet = '';
  setTimeout(function(){
    if (n.dataset.drzet === '1') return;          // mezitím se do nich kliklo
    if (n.contains(document.activeElement)) return;
    n.style.display = 'none';
  }, 250);
}

// Tučně a barva se ukládají hned. Textarea se přebarví na místě, ať se
// nemusí překreslovat celá stránka a odběratel nepřišel o rozepsané.
function prepniTucne(wid){
  drzNastroje(wid);
  var pz = zajistiPoznamku(wid);
  var puvodni = !!pz.pozn_tucne;
  pz.pozn_tucne = !pz.pozn_tucne;
  ulozPoznamkuNaServer({ worker_id: wid, pozn_tucne: pz.pozn_tucne }, function(){
    obnovStylPoznamky(wid);
  }, function(){
    pz.pozn_tucne = puvodni;   // neuložilo se — vrať, jak to bylo
    obnovStylPoznamky(wid);
  });
  obnovStylPoznamky(wid);
}

function dejBarvu(wid, kod){
  drzNastroje(wid);
  var pz = zajistiPoznamku(wid);
  var puvodni = pz.pozn_barva || '';
  pz.pozn_barva = kod || '';
  ulozPoznamkuNaServer({ worker_id: wid, pozn_barva: pz.pozn_barva }, function(){
    obnovStylPoznamky(wid);
  }, function(){
    pz.pozn_barva = puvodni;
    obnovStylPoznamky(wid);
  });
  obnovStylPoznamky(wid);
}

// Kliknutí na tlačítko vyhodí zaostření z poznámky — řekni schovávání,
// ať nástroje nechá být, dokud odběratel neodejde doopravdy.
function drzNastroje(wid){
  var pole = document.querySelector('textarea.pozn[data-w="' + wid + '"]');
  var n = nastrojeU(pole);
  if (n) { n.dataset.drzet = '1'; n.style.display = 'flex'; }
  setTimeout(function(){ if (pole) { try { pole.focus() } catch (e) {} } }, 0);
}

function zajistiPoznamku(wid){
  if (!DATA.poznamky) DATA.poznamky = {};
  DATA.poznamky[wid] = DATA.poznamky[wid] || {};
  return DATA.poznamky[wid];
}

function obnovStylPoznamky(wid){
  var pz = zajistiPoznamku(wid);
  var pole = document.querySelector('textarea.pozn[data-w="' + wid + '"]');
  if (pole) pole.setAttribute('style', stylPoznamky(pz));
  var nastroje = pole && pole.parentElement
    ? pole.parentElement.querySelector('.pozn-nastroje') : null;
  if (!nastroje) return;
  var tucne = nastroje.querySelector('button.tucne');
  if (tucne) tucne.className = pz.pozn_tucne ? 'tucne on' : 'tucne';
  var barvy = nastroje.querySelectorAll('.pozn-barvy button');
  for (var i = 0; i < barvy.length; i++) {
    var kod = i < BARVY_POZNAMKY.length ? BARVY_POZNAMKY[i].kod : '';
    barvy[i].className = ((pz.pozn_barva || '') === kod) ? 'on' : '';
  }
}

// Ukončená spolupráce. Zaškrtnutí a datum se ukládají zvlášť — odběratel může
// zaškrtnout hned a datum doplnit, až si ho dohledá.
function ulozUkonceni(pole){
  var wid = pole.getAttribute('data-w');
  if (!wid) return;
  var zapnuto = !!pole.checked;
  // Políčko na datum ukaž/schovej hned, ať je jasné, co se čeká.
  var obal = document.querySelector('[data-konec-datum="' + wid + '"]');
  if (obal) obal.style.display = zapnuto ? '' : 'none';
  var telo = { worker_id: wid, spoluprace_ukoncena: zapnuto };
  // Odškrtnutím se datum zahodí — jinak by u nezaškrtnutého člověka zůstalo
  // viset staré datum a při příštím zaškrtnutí by se tvářilo jako platné.
  if (!zapnuto) {
    telo.spoluprace_do = '';
    var vstup = document.querySelector('input[type=date][data-w="' + wid + '"]');
    if (vstup) vstup.value = '';
  }
  ulozPoznamkuNaServer(telo, function(){
    if (!DATA.poznamky) DATA.poznamky = {};
    DATA.poznamky[wid] = DATA.poznamky[wid] || {};
    DATA.poznamky[wid].spoluprace_ukoncena = zapnuto;
    if (!zapnuto) DATA.poznamky[wid].spoluprace_do = '';
    oznacKartu(wid);
  }, function(){
    // Neuložilo se — vrať políčko do původního stavu, ať to nevypadá
    // uloženě a odběratel se to nedozvěděl až po obnovení stránky.
    pole.checked = !zapnuto;
    if (obal) obal.style.display = !zapnuto ? '' : 'none';
    oznacKartu(wid);
  });
}

function ulozDatumUkonceni(pole){
  var wid = pole.getAttribute('data-w');
  if (!wid) return;
  var d = String(pole.value || '');
  var puvodni = (DATA.poznamky && DATA.poznamky[wid] && DATA.poznamky[wid].spoluprace_do) || '';
  ulozPoznamkuNaServer({ worker_id: wid, spoluprace_do: d }, function(){
    if (!DATA.poznamky) DATA.poznamky = {};
    DATA.poznamky[wid] = DATA.poznamky[wid] || {};
    DATA.poznamky[wid].spoluprace_do = d;
    oznacKartu(wid);
  }, function(){
    pole.value = puvodni;   // neuložilo se — vrať staré datum
    oznacKartu(wid);
  });
}

// Slovní popis známky — do dotazu, ať je jasné, z čeho na co se mění.
var POPIS_ZNAMKY = {
  1: 'sehr gut · nejlepší', 2: 'gut · velmi dobrý', 3: 'befriedigend · dobrý',
  4: 'ausreichend · dostatečný', 5: 'mangelhaft · slabý', 6: 'ungenügend · nejhorší'
};

function dejZnamku(workerId, n){
  if (!workerId) return;
  var pz = (DATA.poznamky && DATA.poznamky[workerId]) || {};
  var stara = pz.hodnoceni || null;
  if (stara === n) return;                       // klepl na tu samou, nic neděláme

  // Poprvé se neptáme, změna už ano — ať se známka nepřeklikne omylem.
  if (stara) {
    var otazka = (n == null)
      ? 'Bewertung ' + stara + ' entfernen?\nOdebrat hodnocení ' + stara + '?'
      : 'Bewertung wirklich ändern?\n\n'
        + '  ' + stara + ' (' + (POPIS_ZNAMKY[stara] || '') + ')\n'
        + '  → ' + n + ' (' + (POPIS_ZNAMKY[n] || '') + ')\n\n'
        + 'Opravdu změnit hodnocení?';
    if (!confirm(otazka)) return;
  }

  ulozPoznamkuNaServer({ worker_id: workerId, hodnoceni: n }, function(){
    if (!DATA.poznamky) DATA.poznamky = {};
    DATA.poznamky[workerId] = DATA.poznamky[workerId] || {};
    DATA.poznamky[workerId].hodnoceni = n;
    vykreslit(DATA, prekladyCache);
  });
}

function oznacUhrazeno(zaskrtnuto){
  if (!DATA) return;
  ulozPoznamkuNaServer({ uhrazeno: !!zaskrtnuto, kw: DATA.kw, rok: DATA.rok }, function(){
    DATA.uhrazeno = !!zaskrtnuto;
    vykreslit(DATA, prekladyCache);
  });
}

function zmenTyden(v){
  var c = String(v || '').split('/');
  TYDEN = { kw: parseInt(c[0], 10), rok: parseInt(c[1], 10) };
  stav('Wird geladen…');
  nacti(true);
}

function stahnoutCsv(){
  if (!DATA) return;
  var hl = ['Name','Datum','Beginn','Pause','Ende','Baustelle','Taetigkeit','Stunden','Satz','Provision'];
  var radky = DATA.radky.slice().sort(function(a,b){
    return a.jmeno.localeCompare(b.jmeno,'cs') || a.datum.localeCompare(b.datum);
  }).map(function(r){
    return [ r.jmeno, r.datum, r.probiha ? 'laeuft' : (r.prichod || ''),
      (r.pauzy||[]).map(function(p){ return p.od + '-' + p.do }).join(' '),
      r.probiha ? 'laeuft' : (r.odchod || ''), r.stavba || '', r.prace || '',
      r.probiha ? '' : String(r.hodiny).replace('.', ','),
      r.probiha ? '' : String(r.sazba ?? '').replace('.', ','),
      r.probiha ? '' : String(r.provize ?? '').replace('.', ',') ];
  });
  var csv = [hl].concat(radky).map(function(r){
    return r.map(function(b){ return '"' + String(b).replace(/"/g,'""') + '"' }).join(';');
  }).join('\r\n');
  // BOM, ať Excel pozná diakritiku
  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Anwesenheit_KW' + DATA.kw + '_' + DATA.rok + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove() }, 1000);
}

// Stránka se sama obnovuje, aby se opravy od SubBau (změna času nebo adresy)
// projevily bez zásahu klienta. Když je okno na pozadí, neptáme se — nemá to
// smysl a jen by to zbytečně zatěžovalo.
var PRODLEVA_MS = 60000;
var casovac = null;
function naplanuj(){
  if (casovac) clearTimeout(casovac);
  casovac = setTimeout(function(){
    if (document.visibilityState === 'visible') nacti(false); else naplanuj();
  }, PRODLEVA_MS);
}
document.addEventListener('visibilitychange', function(){
  // Návrat k oknu = načti hned, ať klient nekouká na zastaralá čísla.
  if (document.visibilityState === 'visible') nacti(false);
});

function stav(text){
  var el = document.getElementById('stav-obnovy');
  if (el) el.textContent = text || '';
}

// `prvni=1` pošleme jen při prvním načtení. Podle toho server pozná skutečné
// otevření stránky a nezapočítá do něj automatická obnovení.
var prvniNacteni = true;
function nacti(rucne){
  if (rucne) stav('Wird aktualisiert…');
  var adresa = '/api/klient-dochazka?t=' + encodeURIComponent(TOKEN)
             + (prvniNacteni ? '&prvni=1' : '')
             + (TYDEN ? '&kw=' + TYDEN.kw + '&rok=' + TYDEN.rok : '');
  prvniNacteni = false;
  return fetch(adresa, { cache: 'no-store' })
    .then(function(r){ return r.json().then(function(j){ return { stav: r.status, j: j } }) })
    .then(function(o){
      if (!o.j || !o.j.ok){
        if (casovac) { clearTimeout(casovac); casovac = null }
        if (o.stav === 429){
          chyba('Zu viele Anfragen', 'Bitte versuchen Sie es später erneut.',
                'Příliš mnoho dotazů, zkuste to prosím později.');
        } else {
          chyba('Link ungültig', 'Dieser Link ist ungültig oder wurde deaktiviert. '
            + 'Bitte fordern Sie bei SubBau einen neuen Link an.',
            'Odkaz je neplatný nebo byl deaktivován.');
        }
        return;
      }
      // Rozepsanou poznámku, kterou zrovna píše, nesmí obnovení přemazat.
      var rozepsane = {};
      document.querySelectorAll('textarea.pozn').forEach(function(t){
        if (document.activeElement === t) rozepsane[t.getAttribute('data-w')] = t.value;
      });
      DATA = o.j;
      Object.keys(rozepsane).forEach(function(w){
        DATA.poznamky = DATA.poznamky || {};
        DATA.poznamky[w] = DATA.poznamky[w] || {};
        DATA.poznamky[w].poznamka = rozepsane[w];
      });
      var popisy = {};
      DATA.radky.forEach(function(r){ if (r.prace) popisy[r.prace] = 1 });
      var klice = Object.keys(popisy).filter(function(k){ return prekladyCache[k] === undefined });

      function hotovo(){
        vykreslit(DATA, prekladyCache);
        var d = new Date();
        stav('Stand ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'));
        naplanuj();
      }
      if (!klice.length){ hotovo(); return; }

      // Čeká se na VŠECHNY překlady naráz. Kdyby se dokreslovaly postupně,
      // měl by klient část řádků německy a část česky — a to je přesně ta
      // nejednotnost, kterou nechceme. Když se překladač do pěti vteřin
      // neozve, zobrazí se všechno česky, zase jednotně.
      var dokresleno = false;
      var pojistka = setTimeout(function(){ if (!dokresleno){ dokresleno = true; hotovo() } }, 5000);
      Promise.all(klice.map(prelozit)).then(function(vys){
        klice.forEach(function(k,i){ prekladyCache[k] = vys[i] || null });
        if (!dokresleno){ dokresleno = true; clearTimeout(pojistka); hotovo() }
      });
    })
    .catch(function(){
      // Výpadek sítě není důvod smazat, co už klient vidí — jen to řekneme
      // a zkusíme to za chvíli znovu.
      if (DATA) { stav('Keine Verbindung · bez připojení'); naplanuj(); }
      else chyba('Verbindungsfehler', 'Die Daten konnten nicht geladen werden. Bitte später erneut versuchen.',
                 'Data se nepodařilo načíst, zkuste to prosím později.');
    });
}

if (!TOKEN){
  chyba('Link ungültig', 'Dieser Link ist ungültig oder wurde deaktiviert.',
        'Odkaz je neplatný nebo byl deaktivován.');
} else {
  nacti(false);
}
</script>
