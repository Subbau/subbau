<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Token je v adrese. Bez tohohle by odešel v hlavičce Referer na každou
     cizí doménu, na kterou by stránka sáhla (třeba na překladač). -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Anwesenheit · Docházka — SubBau</title>
<style>
  :root{
    --tmava:#211D1A; --zlata:#E8A13A; --seda:#9a9082; --seda2:#6b6157;
    --ram:#e0d9cf; --pozadi:#f7f4ef; --zelena:#3f7d54;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--pozadi);color:var(--tmava);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       font-size:15px;line-height:1.5}
  .obal{max-width:1000px;margin:0 auto;padding:18px 14px 60px}
  header{background:var(--tmava);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px}
  header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px}
  header .pod{color:var(--zlata);font-size:13px;font-weight:700;margin-top:3px}
  header .obdobi{color:#cfc7bd;font-size:13px;margin-top:8px}
  .clovek{background:#fff;border:1px solid var(--ram);border-radius:14px;
          margin-bottom:12px;overflow:hidden}
  .hlava{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
         padding:13px 16px;border-bottom:1px solid var(--ram);flex-wrap:wrap}
  .jmeno{font-size:16px;font-weight:800}
  .soucet{font-size:17px;font-weight:800;color:var(--zelena);white-space:nowrap}
  .soucet small{display:block;font-size:10px;color:var(--seda);font-weight:600;text-align:right}
  .tab{width:100%;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;
     color:var(--seda);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--ram);
     white-space:nowrap}
  th small{display:block;font-size:9px;text-transform:none;letter-spacing:0;
           color:var(--ram);font-weight:600}
  td{padding:10px;border-bottom:1px solid #f1ece4;vertical-align:top}
  tr:last-child td{border-bottom:none}
  .cas{font-variant-numeric:tabular-nums;white-space:nowrap}
  .bezi{color:#b8860b;font-weight:800}
  .radek-bezi{background:#fffaf0}
  .probiha{color:#b8860b;font-weight:700;font-size:13px}
  .foto{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--pozadi);
        border:2px solid var(--ram);flex:none;cursor:pointer;display:block}
  .foto-prazdna{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--seda)}
  .znamka{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
  .znamka button{width:30px;height:30px;padding:0;border-radius:8px;border:1.5px solid var(--ram);
                 background:#fff;color:var(--seda2);font-weight:800;font-size:13px;cursor:pointer}
  .znamka button.on{background:var(--tmava);color:#fff;border-color:var(--tmava)}
  .znamka button.mimo{opacity:.45}
  textarea.pozn{width:100%;margin-top:7px;padding:8px 10px;border:1.5px solid var(--ram);
                border-radius:9px;font-family:inherit;font-size:13.5px;resize:vertical;
                box-sizing:border-box;background:#fff;color:var(--tmava)}
  @media print{.znamka,textarea.pozn{display:none}}
  .penize{font-size:12.5px;color:var(--seda2);margin-top:3px;line-height:1.5}
  .penize b{color:var(--tmava);font-variant-numeric:tabular-nums}
  .souhrn{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--seda2);
          margin-top:6px;padding-top:6px;border-top:1px dashed var(--ram)}
  .souhrn b{color:var(--tmava);font-variant-numeric:tabular-nums}
  select{font-family:inherit;font-size:14px;font-weight:700;padding:9px 12px;
         border-radius:10px;border:1.5px solid var(--ram);background:#fff;color:var(--tmava)}
  .hod{font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .drobne{font-size:11.5px;color:var(--seda2)}
  .de{color:var(--seda);font-size:11.5px;font-style:italic}
  .celkem{background:var(--tmava);color:#fff;border-radius:14px;padding:16px 20px;
          display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .celkem .c{font-size:24px;font-weight:800;color:var(--zlata)}
  .tlacitka{display:flex;gap:9px;margin:16px 0;flex-wrap:wrap}
  button{font-family:inherit;font-size:14px;font-weight:700;padding:11px 18px;
         border-radius:11px;border:1.5px solid var(--tmava);background:#fff;
         color:var(--tmava);cursor:pointer}
  button.hlavni{background:var(--tmava);color:var(--zlata);border-color:var(--tmava)}
  .zprava{background:#fff;border:1px solid var(--ram);border-radius:14px;
          padding:34px 22px;text-align:center;color:var(--seda2)}
  .zprava h2{margin:0 0 8px;font-size:17px;color:var(--tmava)}
  .pata{margin-top:22px;font-size:11.5px;color:var(--seda);text-align:center;line-height:1.7}
  @media print{
    body{background:#fff}
    .tlacitka,.pata{display:none}
    .obal{max-width:none;padding:0}
    header{background:#fff;color:#000;border:1px solid #000;border-radius:0}
    header .pod{color:#000}header .obdobi{color:#333}
    .clovek{break-inside:avoid;page-break-inside:avoid;border:1px solid #999;border-radius:0}
    .celkem{background:#fff;color:#000;border:2px solid #000;border-radius:0}
    .celkem .c{color:#000}
  }
</style>
</head>
<body>
<div class="obal" id="obal">
  <div class="zprava"><h2>Wird geladen…</h2><div class="de">Načítám…</div></div>
</div>

<script>
// Token z adresy. Do stránky se nikde nevypisuje.
var TOKEN = new URLSearchParams(location.search).get('t') || '';
var TYDEN = null;   // {kw, rok} — když je prázdné, server dá probíhající týden
var obal = document.getElementById('obal');

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function chyba(nadpis, de, cs){
  obal.innerHTML = '<div class="zprava"><h2>' + esc(nadpis) + '</h2>'
    + '<div>' + esc(de) + '</div><div class="de">' + esc(cs) + '</div></div>';
}
var DNY_DE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var DNY_CS = ['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];
function datumDe(iso){
  var d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return DNY_DE[d.getDay()].slice(0,2) + ' ' +
    String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.';
}
function datumCs(iso){
  var d = new Date(iso + 'T00:00:00');
  return isNaN(d) ? iso : DNY_CS[d.getDay()];
}
function hod(n){ return (Number(n)||0).toFixed(2).replace('.', ','); }

// Překlad popisu práce do němčiny. Je to ozdoba — když překladač neodpoví,
// zůstane český text a stránka se kvůli tomu nezdrží.
var mezipamet = {};
function prelozit(text){
  var t = (text||'').trim();
  if (!t) return Promise.resolve(null);
  if (mezipamet[t] !== undefined) return Promise.resolve(mezipamet[t]);
  var ac = new AbortController();
  var casovac = setTimeout(function(){ try{ac.abort()}catch(e){} }, 3500);
  return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=cs&tl=de&dt=t&q='
      + encodeURIComponent(t), { signal: ac.signal, referrerPolicy: 'no-referrer' })
    .then(function(r){ return r.ok ? r.json() : null })
    .then(function(d){
      var v = d && d[0] ? d[0].map(function(s){ return s[0] }).join('') : null;
      mezipamet[t] = v || null;
      return mezipamet[t];
    })
    .catch(function(){ mezipamet[t] = null; return null })
    .finally(function(){ clearTimeout(casovac) });
}

var DATA = null;
var prekladyCache = {};

function vykreslit(d, preklady){
  preklady = preklady || {};
  var podle = {};
  d.radky.forEach(function(r){ (podle[r.jmeno] = podle[r.jmeno] || []).push(r) });
  var jmena = Object.keys(podle).sort(function(a,b){ return a.localeCompare(b,'cs') });

  var celkem = 0;
  var html = '<header>'
    + '<h1>' + esc(d.nazev) + '</h1>'
    + '<div class="pod">Anwesenheitsübersicht · Přehled docházky</div>'
    + '<div class="obdobi">KW ' + d.kw + ' / ' + d.rok + ' &nbsp;·&nbsp; '
    + esc(d.od.split('-').reverse().join('.')) + ' – ' + esc(d.do.split('-').reverse().join('.'))
    + '</div></header>';

  // Přepínač týdnů — odběratel si smí prolistovat i starší.
  if (d.tydny && d.tydny.length){
    html += '<div class="tlacitka" style="margin-bottom:6px">'
      + '<label style="align-self:center;font-size:13px;color:var(--seda2);font-weight:700">'
      + 'Woche · Týden</label>'
      + '<select id="vyber-tydne" onchange="zmenTyden(this.value)">'
      + d.tydny.map(function(t){
          var v = t.kw + '/' + t.rok
          return '<option value="' + v + '"' + (t.kw === d.kw && t.rok === d.rok ? ' selected' : '')
               + '>KW ' + t.kw + ' / ' + t.rok + '</option>'
        }).join('')
      + '</select>'
      + '<label style="display:flex;align-items:center;gap:8px;align-self:center;'
      + 'font-size:13.5px;font-weight:700;color:' + (d.uhrazeno ? 'var(--zelena)' : 'var(--seda2)') + ';cursor:pointer">'
      + '<input type="checkbox" id="uhrazeno" onchange="oznacUhrazeno(this.checked)"'
      + (d.uhrazeno ? ' checked' : '') + ' style="width:19px;height:19px">'
      + '<span>Rechnungen dieser Woche bezahlt'
      + '<div style="font-size:11.5px;font-weight:500;color:var(--seda)">tento týden uhrazené faktury</div>'
      + '</span></label>'
      + '</div>';
  }

  html += '<div class="tlacitka">'
    + '<button class="hlavni" onclick="window.print()">📄 Als PDF speichern · Uložit do PDF</button>'
    + '<button onclick="stahnoutCsv()">📊 Excel (CSV)</button>'
    + '<button onclick="nacti(true)">🔄 Aktualisieren · Obnovit</button>'
    + '<span id="stav-obnovy" class="de" style="align-self:center"></span>'
    + '</div>';

  if (!jmena.length){
    html += '<div class="zprava"><h2>Keine Einträge für diese Woche</h2>'
      + '<div class="de">Za tento týden zatím není zapsaná žádná docházka.</div></div>';
    obal.innerHTML = html;
    return;
  }

  jmena.forEach(function(jm){
    var dny = podle[jm].slice().sort(function(a,b){ return a.datum.localeCompare(b.datum) });
    var suma = dny.reduce(function(s,r){ return s + (Number(r.hodiny)||0) }, 0);
    celkem += suma;
    // Peníze: sazba pracovníka a provize SubBau. Sčítá se den po dni, protože
    // se sazba mohla během období změnit — jinak by to nesedělo s fakturou.
    //
    // Když se sazba měnila, NEUKAZUJEME průměr. Průměrné číslo (22,80) neodpovídá
    // žádné skutečné sazbě a odběratele jen mate. Místo toho se vypíše rozpis:
    // kolik hodin za kolik. Stejně to má i faktura, když sazba skočí uprostřed týdne.
    var fakturovano = 0, provizeCelkem = 0
    var podleSazby = {}, podleProvize = {}
    dny.forEach(function(r){
      if (r.probiha) return
      var h = Number(r.hodiny) || 0
      var sz = Number(r.sazba) || 0
      var pr = Number(r.provize) || 0
      fakturovano += h * sz
      provizeCelkem += h * pr
      podleSazby[sz.toFixed(2)] = (podleSazby[sz.toFixed(2)] || 0) + h
      podleProvize[pr.toFixed(2)] = (podleProvize[pr.toFixed(2)] || 0) + h
    })
    // „20,00 Std. × 22,00 €" pro každou sazbu, od nejnižší
    function rozpis(mapa, jednotka){
      var klice = Object.keys(mapa).sort(function(a,b){ return Number(a) - Number(b) })
      if (!klice.length) return '—'
      if (klice.length === 1) return '<b>' + hod(klice[0]) + ' €</b>/' + jednotka
      return klice.map(function(k){
        return '<b>' + hod(mapa[k]) + ' Std.</b> × <b>' + hod(k) + ' €</b>'
      }).join(' &nbsp;·&nbsp; ')
    }

    var wid = (dny[0] && dny[0].worker) || ''
    var pz = (DATA.poznamky && DATA.poznamky[wid]) || { foto:null, poznamka:'', hodnoceni:null }

    html += '<div class="clovek"><div class="hlava" style="align-items:flex-start">'
      + '<div style="display:flex;gap:12px;align-items:flex-start;min-width:0">'
      + (pz.foto
          ? '<img class="foto" src="' + esc(pz.foto) + '" alt="" onclick="vyberFoto(\'' + esc(wid) + '\')" title="Foto ändern · změnit fotku">'
          : '<div class="foto foto-prazdna" onclick="vyberFoto(\'' + esc(wid) + '\')" title="Foto hinzufügen · přidat fotku">＋</div>')
      + '<div style="min-width:0"><div class="jmeno">' + esc(jm) + '</div>'
      + '<div class="penize">' + rozpis(podleSazby, 'Std.')
      + '<div style="margin-top:2px">Provision ' + rozpis(podleProvize, 'Std.') + '</div>'
      + '<div style="font-size:11px;color:var(--seda)">hodinovka · provize</div>'
      + '<div class="znamka" data-w="' + esc(wid) + '">'
      + '<span style="align-self:center;font-size:11.5px;color:var(--seda);margin-right:4px">'
      + 'Note · známka<div style="font-size:10.5px">1 = beste · nejlepší &nbsp; 6 = schlechteste · nejhorší</div></span>'
      + [1,2,3,4,5,6].map(function(n){
          return '<button onclick="dejZnamku(\'' + esc(wid) + '\',' + n + ')"'
               + (pz.hodnoceni === n ? ' class="on"' : (pz.hodnoceni ? ' class="mimo"' : ''))
               + ' title="' + ({1:'1 — sehr gut · nejlepší',2:'2 — gut · velmi dobrý',3:'3 — befriedigend · dobrý',
                  4:'4 — ausreichend · dostatečný',5:'5 — mangelhaft · slabý',
                  6:'6 — ungenügend · nejhorší'}[n]) + '">' + n + '</button>'
        }).join('')
      + (pz.hodnoceni ? '<button onclick="dejZnamku(\'' + esc(wid) + '\',null)" style="width:auto;padding:0 9px;font-weight:600">✕</button>' : '')
      + '</div>'
      + '</div></div>'
      + '<div class="soucet">' + hod(suma) + ' Std.'
      + '<small>' + (dny.some(function(x){ return x.probiha })
          ? 'ohne laufende Tage · bez probíhajících' : 'Stunden · hodin') + '</small></div>'
      + '</div>'
      + '<div style="padding:0 16px 10px"><div class="souhrn">'
      + '<span>Rechnungsbetrag · fakturovaná částka <b>' + hod(fakturovano) + ' €</b></span>'
      + '<span>Provision · provize <b>' + hod(provizeCelkem) + ' €</b></span>'
      + '<span>Gesamt · celkem <b>' + hod(fakturovano + provizeCelkem) + ' €</b></span>'
      + '</div></div>'
      + '<div style="padding:0 16px 12px">'
      + '<textarea class="pozn" rows="2" placeholder="Hier können Sie sich eine Notiz machen · zde si můžete napsat poznámku"'
      + ' data-w="' + esc(wid) + '" onchange="ulozPoznamku(this)">' + esc(pz.poznamka || '') + '</textarea>'
      + '</div>'
      + '<div class="tab"><table><thead><tr>'
      + '<th>Datum<small>datum</small></th>'
      + '<th>Beginn<small>příchod</small></th>'
      + '<th>Pause<small>přestávka</small></th>'
      + '<th>Ende<small>odchod</small></th>'
      + '<th>Baustelle · Tätigkeit<small>stavba · práce</small></th>'
      + '<th style="text-align:right">Std.<small>hodin</small></th>'
      + '</tr></thead><tbody>';
    dny.forEach(function(r){
      var pauza = (r.pauzy && r.pauzy.length)
        ? r.pauzy.map(function(p){ return esc(p.od) + '–' + esc(p.do) }).join('<br>')
        : '<span class="drobne">—</span>';
      var prace = '';
      if (r.stavba) prace += '<div>' + esc(r.stavba) + '</div>';
      if (r.prace){
        // Německy nahoře (stránku čte Němec), český originál drobně pod tím.
        // Když překlad nedorazil, zůstane jen čeština — ale to nastane u všech
        // řádků naráz, ne u některých, takže tabulka vypadá jednotně.
        var de = preklady[r.prace];
        if (de && de !== r.prace){
          prace += '<div>' + esc(de) + '</div>';
          prace += '<div class="drobne">' + esc(r.prace) + '</div>';
        } else {
          prace += '<div>' + esc(r.prace) + '</div>';
        }
      }
      if (!prace) prace = '<span class="drobne">—</span>';
      var datumBunka = '<td class="cas">' + esc(datumDe(r.datum))
        + '<div class="drobne">' + esc(datumCs(r.datum)) + '</div></td>';
      if (r.probiha){
        // Hodiny se dopisují až po skončení směny — místo časů jeden nápis
        // přes tři sloupce. Adresa a popis práce zůstávají.
        html += '<tr class="radek-bezi">' + datumBunka
          + '<td colspan="3" class="probiha">Stundenerfassung läuft'
            + '<div class="drobne">Probíhá zápis hodin</div></td>'
          + '<td>' + prace + '</td>'
          + '<td class="hod probiha">—</td>'
          + '</tr>';
      } else {
        html += '<tr>' + datumBunka
          + '<td class="cas">' + esc(r.prichod || '—') + '</td>'
          + '<td class="cas drobne">' + pauza + '</td>'
          + '<td class="cas">' + esc(r.odchod || '—') + '</td>'
          + '<td>' + prace + '</td>'
          + '<td class="hod">' + hod(r.hodiny) + '</td>'
          + '</tr>';
      }
    });
    html += '</tbody></table></div></div>';
  });

  var fakturovanoVse = 0, provizeVse = 0;
  d.radky.forEach(function(r){
    if (r.probiha) return;
    var h = Number(r.hodiny) || 0;
    fakturovanoVse += h * (Number(r.sazba) || 0);
    provizeVse += h * (Number(r.provize) || 0);
  });
  html += '<div class="celkem"><div>Gesamt · Celkem<div style="font-size:12px;color:#cfc7bd">'
    + jmena.length + ' Handwerker · řemeslníků</div>'
    + '<div style="font-size:12.5px;color:#cfc7bd;margin-top:5px">'
    + 'Rechnungsbetrag ' + hod(fakturovanoVse) + ' € &nbsp;·&nbsp; Provision ' + hod(provizeVse) + ' €</div></div>'
    + '<div style="text-align:right"><div class="c">' + hod(fakturovanoVse + provizeVse) + ' €</div>'
    + '<div style="font-size:13px;color:#cfc7bd">' + hod(celkem) + ' Std.</div></div></div>';

  html += '<div class="pata">'
    + '<b>Nach Arbeitsende wird die vollständige Arbeitszeit angezeigt.</b><br>'
    + 'Po ukončení docházky se zobrazí celá jeho pracovní doba.<br><br>'
    + 'Tätigkeitsbeschreibungen sind maschinell übersetzt.<br>'
    + 'Popisy práce jsou přeložené strojově.<br><br>'
    + 'Bitte diesen Link nicht weitergeben · Odkaz prosím nikomu nepřeposílejte.</div>';

  obal.innerHTML = html;
}

// ===== CO SI ODBĚRATEL POZNAMENÁ =====
// Fotka, poznámka a známka. Ukládá se to k odkazu, ne k pracovníkovi —
// jiný odběratel to nevidí a v appce SubBau se to nikde neobjeví.

function ulozPoznamkuNaServer(data, hotovo){
  fetch('/api/klient-dochazka?t=' + encodeURIComponent(TOKEN), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
    cache: 'no-store',
  })
    .then(function(r){ return r.json().catch(function(){ return {} }) })
    .then(function(j){
      if (j && j.ok) { stav('Gespeichert · uloženo'); hotovo && hotovo() }
      else {
        var duvod = (j && j.chyba === 'fotka_prilis_velka')
          ? 'Foto zu groß · fotka je moc velká'
          : 'Nicht gespeichert · neuloženo';
        stav(duvod);
      }
    })
    .catch(function(){ stav('Keine Verbindung · bez připojení') });
}

// Fotku zmenšíme rovnou v prohlížeči. Z mobilu chodí snímky přes 3 MB a ty
// by server odmítl — po zmenšení na 256 px má pár desítek kilobajtů.
function vyberFoto(workerId){
  if (!workerId) return;
  var vstup = document.createElement('input');
  vstup.type = 'file';
  vstup.accept = 'image/*';
  vstup.onchange = function(){
    var soubor = vstup.files && vstup.files[0];
    if (!soubor) return;
    stav('Wird verkleinert…');
    var cteni = new FileReader();
    cteni.onload = function(){
      var obr = new Image();
      obr.onload = function(){
        var S = 256;
        var pl = document.createElement('canvas');
        pl.width = S; pl.height = S;
        var ctx = pl.getContext('2d');
        // Ořízneme na čtverec ze středu, ať kolečko nedeformuje obličej.
        var m = Math.min(obr.width, obr.height);
        ctx.drawImage(obr, (obr.width - m) / 2, (obr.height - m) / 2, m, m, 0, 0, S, S);
        var maly = pl.toDataURL('image/jpeg', 0.72);
        ulozPoznamkuNaServer({ worker_id: workerId, foto: maly }, function(){
          if (!DATA.poznamky) DATA.poznamky = {};
          DATA.poznamky[workerId] = DATA.poznamky[workerId] || {};
          DATA.poznamky[workerId].foto = maly;
          vykreslit(DATA, prekladyCache);
        });
      };
      obr.onerror = function(){ stav('Bild konnte nicht gelesen werden · obrázek nejde načíst') };
      obr.src = cteni.result;
    };
    cteni.readAsDataURL(soubor);
  };
  vstup.click();
}

function ulozPoznamku(pole){
  var wid = pole.getAttribute('data-w');
  if (!wid) return;
  var text = String(pole.value || '').slice(0, 1000);
  ulozPoznamkuNaServer({ worker_id: wid, poznamka: text }, function(){
    if (!DATA.poznamky) DATA.poznamky = {};
    DATA.poznamky[wid] = DATA.poznamky[wid] || {};
    DATA.poznamky[wid].poznamka = text;   // ať se po obnovení nevrátí staré
  });
}

function dejZnamku(workerId, n){
  if (!workerId) return;
  ulozPoznamkuNaServer({ worker_id: workerId, hodnoceni: n }, function(){
    if (!DATA.poznamky) DATA.poznamky = {};
    DATA.poznamky[workerId] = DATA.poznamky[workerId] || {};
    DATA.poznamky[workerId].hodnoceni = n;
    vykreslit(DATA, prekladyCache);
  });
}

function oznacUhrazeno(zaskrtnuto){
  if (!DATA) return;
  ulozPoznamkuNaServer({ uhrazeno: !!zaskrtnuto, kw: DATA.kw, rok: DATA.rok }, function(){
    DATA.uhrazeno = !!zaskrtnuto;
    vykreslit(DATA, prekladyCache);
  });
}

function zmenTyden(v){
  var c = String(v || '').split('/');
  TYDEN = { kw: parseInt(c[0], 10), rok: parseInt(c[1], 10) };
  stav('Wird geladen…');
  nacti(true);
}

function stahnoutCsv(){
  if (!DATA) return;
  var hl = ['Name','Datum','Beginn','Pause','Ende','Baustelle','Taetigkeit','Stunden','Satz','Provision'];
  var radky = DATA.radky.slice().sort(function(a,b){
    return a.jmeno.localeCompare(b.jmeno,'cs') || a.datum.localeCompare(b.datum);
  }).map(function(r){
    return [ r.jmeno, r.datum, r.probiha ? 'laeuft' : (r.prichod || ''),
      (r.pauzy||[]).map(function(p){ return p.od + '-' + p.do }).join(' '),
      r.probiha ? 'laeuft' : (r.odchod || ''), r.stavba || '', r.prace || '',
      r.probiha ? '' : String(r.hodiny).replace('.', ','),
      r.probiha ? '' : String(r.sazba ?? '').replace('.', ','),
      r.probiha ? '' : String(r.provize ?? '').replace('.', ',') ];
  });
  var csv = [hl].concat(radky).map(function(r){
    return r.map(function(b){ return '"' + String(b).replace(/"/g,'""') + '"' }).join(';');
  }).join('\r\n');
  // BOM, ať Excel pozná diakritiku
  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Anwesenheit_KW' + DATA.kw + '_' + DATA.rok + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove() }, 1000);
}

// Stránka se sama obnovuje, aby se opravy od SubBau (změna času nebo adresy)
// projevily bez zásahu klienta. Když je okno na pozadí, neptáme se — nemá to
// smysl a jen by to zbytečně zatěžovalo.
var PRODLEVA_MS = 60000;
var casovac = null;
function naplanuj(){
  if (casovac) clearTimeout(casovac);
  casovac = setTimeout(function(){
    if (document.visibilityState === 'visible') nacti(false); else naplanuj();
  }, PRODLEVA_MS);
}
document.addEventListener('visibilitychange', function(){
  // Návrat k oknu = načti hned, ať klient nekouká na zastaralá čísla.
  if (document.visibilityState === 'visible') nacti(false);
});

function stav(text){
  var el = document.getElementById('stav-obnovy');
  if (el) el.textContent = text || '';
}

// `prvni=1` pošleme jen při prvním načtení. Podle toho server pozná skutečné
// otevření stránky a nezapočítá do něj automatická obnovení.
var prvniNacteni = true;
function nacti(rucne){
  if (rucne) stav('Wird aktualisiert…');
  var adresa = '/api/klient-dochazka?t=' + encodeURIComponent(TOKEN)
             + (prvniNacteni ? '&prvni=1' : '')
             + (TYDEN ? '&kw=' + TYDEN.kw + '&rok=' + TYDEN.rok : '');
  prvniNacteni = false;
  return fetch(adresa, { cache: 'no-store' })
    .then(function(r){ return r.json().then(function(j){ return { stav: r.status, j: j } }) })
    .then(function(o){
      if (!o.j || !o.j.ok){
        if (casovac) { clearTimeout(casovac); casovac = null }
        if (o.stav === 429){
          chyba('Zu viele Anfragen', 'Bitte versuchen Sie es später erneut.',
                'Příliš mnoho dotazů, zkuste to prosím později.');
        } else {
          chyba('Link ungültig', 'Dieser Link ist ungültig oder wurde deaktiviert. '
            + 'Bitte fordern Sie bei SubBau einen neuen Link an.',
            'Odkaz je neplatný nebo byl deaktivován.');
        }
        return;
      }
      // Rozepsanou poznámku, kterou zrovna píše, nesmí obnovení přemazat.
      var rozepsane = {};
      document.querySelectorAll('textarea.pozn').forEach(function(t){
        if (document.activeElement === t) rozepsane[t.getAttribute('data-w')] = t.value;
      });
      DATA = o.j;
      Object.keys(rozepsane).forEach(function(w){
        DATA.poznamky = DATA.poznamky || {};
        DATA.poznamky[w] = DATA.poznamky[w] || {};
        DATA.poznamky[w].poznamka = rozepsane[w];
      });
      var popisy = {};
      DATA.radky.forEach(function(r){ if (r.prace) popisy[r.prace] = 1 });
      var klice = Object.keys(popisy).filter(function(k){ return prekladyCache[k] === undefined });

      function hotovo(){
        vykreslit(DATA, prekladyCache);
        var d = new Date();
        stav('Stand ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'));
        naplanuj();
      }
      if (!klice.length){ hotovo(); return; }

      // Čeká se na VŠECHNY překlady naráz. Kdyby se dokreslovaly postupně,
      // měl by klient část řádků německy a část česky — a to je přesně ta
      // nejednotnost, kterou nechceme. Když se překladač do pěti vteřin
      // neozve, zobrazí se všechno česky, zase jednotně.
      var dokresleno = false;
      var pojistka = setTimeout(function(){ if (!dokresleno){ dokresleno = true; hotovo() } }, 5000);
      Promise.all(klice.map(prelozit)).then(function(vys){
        klice.forEach(function(k,i){ prekladyCache[k] = vys[i] || null });
        if (!dokresleno){ dokresleno = true; clearTimeout(pojistka); hotovo() }
      });
    })
    .catch(function(){
      // Výpadek sítě není důvod smazat, co už klient vidí — jen to řekneme
      // a zkusíme to za chvíli znovu.
      if (DATA) { stav('Keine Verbindung · bez připojení'); naplanuj(); }
      else chyba('Verbindungsfehler', 'Die Daten konnten nicht geladen werden. Bitte später erneut versuchen.',
                 'Data se nepodařilo načíst, zkuste to prosím později.');
    });
}

if (!TOKEN){
  chyba('Link ungültig', 'Dieser Link ist ungültig oder wurde deaktiviert.',
        'Odkaz je neplatný nebo byl deaktivován.');
} else {
  nacti(false);
}
</script>
